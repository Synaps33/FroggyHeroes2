# Free Heroes II - konfiguracja rdzenia dla GB300
#
# UWAGA: wartosci bool w tym pliku musza byc liczbami ("1" = wlaczony).
# Parser Settings::Read() uzywa IntParams()/String::ToInt(), a "on" NIE jest
# parsowane i daje 0, co w kodzie oznacza WYLACZENIE opcji.
#
# 320x240 jest rozdzielczoscia QVGA, a Settings::Read() przy QVGA sam wlacza
# GLOBAL_POCKETPC + GAME_HIDE_INTERFACE, dzieki czemu mapa przygody zajmuje
# pelna szerokosc ekranu zamiast miec staly pasek boczny.
videomode = 320x240

# dzwiek efektowy (muzyki z AGG nie uzywamy - plikow MIDI brak)
sound = 1
sound volume = 10
music = off

# ograniczenie animacji dla plynnego dzialania na GB300
animation = 4

# ukrycie interfejsu dla pelnoszerokiej mapy
pocket pc = 1
